[package]
name = "termos-render"
description = "TermOS renderer: cell grid, damage tracking, colour/themes and output backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# The software rasterizer the KMS client draws with (D-073): swash and the
# bundled DejaVu Sans Mono.
raster = ["dep:swash"]

[dependencies]
base64.workspace = true
bitflags = { workspace = true, features = ["serde"] }
compact_str = { workspace = true, features = ["serde"] }
image.workspace = true
thiserror.workspace = true
serde.workspace = true
swash = { workspace = true, optional = true }
unicode-segmentation.workspace = true
unicode-width.workspace = true

[dev-dependencies]
insta.workspace = true
criterion.workspace = true
proptest.workspace = true
toml.workspace = true
vt100.workspace = true

[[bench]]
name = "render"
harness = false

[[bench]]
name = "raster"
harness = false
required-features = ["raster"]

[lints]
workspace = true
