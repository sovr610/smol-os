[package]
name = "termos-harness"
description = "The TermOS coding harness: plans, routes and runs tasks over Claude Code, Codex CLI and API models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["tls"]
# HTTPS for API backends (termos-ai's providers, D-058); left out only
# where ring cannot be built (clippy for Windows from Linux).
tls = ["termos-ai/tls"]

[dependencies]
jiff.workspace = true
ratatui-core.workspace = true
serde.workspace = true
serde_json.workspace = true
termos-ai.workspace = true
termos-core.workspace = true
termos-devkit.workspace = true
termos-render.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
unicode-width.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true

[lints]
workspace = true
