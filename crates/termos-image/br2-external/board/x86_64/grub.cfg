# TermOS on x86_64 (D-075, D-078). The same file serves BIOS (/boot/grub)
# and UEFI (/EFI/BOOT). It picks root slot A or B as RAUC's GRUB backend
# expects (ORDER, <slot>_OK, <slot>_TRY in /grubenv on this partition) and
# loads that slot's kernel from inside its squashfs, so an update replaces
# the kernel and the system together. A slot is tried once: if it never
# reports good, the next boot takes the other one.
set default=0
set timeout=1
set envfile=/grubenv

set ORDER="A B"
set A_OK=0
set B_OK=0
set A_TRY=0
set B_TRY=0
load_env --file $envfile

set any_ok=0
for SLOT in $ORDER; do
	if [ "$SLOT" == "A" ]; then
		INDEX=0
		OK=$A_OK
		TRY=$A_TRY
		A_TRY=1
	fi
	if [ "$SLOT" == "B" ]; then
		INDEX=1
		OK=$B_OK
		TRY=$B_TRY
		B_TRY=1
	fi
	if [ "$OK" -eq 1 -a "$TRY" -eq 0 ]; then
		default=$INDEX
		any_ok=1
		break
	fi
done

# Both slots failed: try the good ones again rather than boot nothing.
if [ "$any_ok" -eq 0 ]; then
	if [ "$A_OK" -eq 1 -a "$A_TRY" -eq 1 ]; then
		A_TRY=0
	fi
	if [ "$B_OK" -eq 1 -a "$B_TRY" -eq 1 ]; then
		B_TRY=0
	fi
fi
save_env --file $envfile A_TRY B_TRY

# The disk this partition is on ("hd0,msdos1" gives "hd0").
regexp --set=1:disk '^([^,]+),' "$root"
set cmdline="ro rootfstype=squashfs rootwait quiet loglevel=3 panic=10 console=tty1 console=ttyS0,115200"

menuentry "TermOS (slot A)" {
	linux ($disk,msdos2)/boot/bzImage root=PARTUUID=7e57c0de-02 rauc.slot=A $cmdline
}

menuentry "TermOS (slot B)" {
	linux ($disk,msdos3)/boot/bzImage root=PARTUUID=7e57c0de-03 rauc.slot=B $cmdline
}
