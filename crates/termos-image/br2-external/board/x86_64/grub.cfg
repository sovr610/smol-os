# TermOS on x86_64 (D-075). The same file serves BIOS (/boot/grub) and
# UEFI (/EFI/BOOT); the kernel is on this partition, the root is slot A.
set default=0
set timeout=1

menuentry "TermOS" {
	linux /bzImage root=PARTUUID=7e57c0de-02 rootfstype=squashfs ro rootwait quiet loglevel=3 console=tty1 console=ttyS0,115200
}
