# x86_64 (D-075, D-124): one GPT disk that boots both ways. BIOS: GRUB's
# boot.img in the protective MBR loads its core image from the BIOS boot
# partition (post-image.sh tells both where it is). UEFI: the firmware finds
# the EFI system partition, which is also GRUB's /boot for BIOS, and holds
# GRUB's environment for the A/B choice (D-078). Then: root slots A and B,
# each with its kernel inside, and the data partition. The system finds them
# by their names (boot, rootfs-a, rootfs-b, data) on the disk it booted
# from. The ids are fixed so builds are reproducible; `termos install` gives
# each installed disk new ones.

image esp.vfat {
	vfat {
		label = "TERMOS"
		file EFI {
			image = "esp/EFI"
		}
		file boot {
			image = "esp/boot"
		}
		file grubenv {
			image = "esp/grubenv"
		}
	}
	size = 64M
}

image data.ext4 {
	ext4 {
		label = "termos-data"
		use-mke2fs = true
	}
	size = 512M
}

image disk.img {
	hdimage {
		partition-table-type = "gpt"
		disk-uuid = "7e57c0de-0000-4000-8000-000000000000"
	}

	partition boot-mbr {
		in-partition-table = "no"
		image = "boot.img"
		offset = 0
		size = 512
		holes = {"(440; 512)"}
	}

	partition bios {
		partition-type-uuid = "21686148-6449-6e6f-744e-656564454649"
		partition-uuid = "7e57c0de-0000-4000-8000-000000000001"
		image = "grub.img"
		offset = 1M
		size = 1M
	}

	partition boot {
		partition-type-uuid = "c12a7328-f81f-11d2-ba4b-00a0c93ec93b"
		partition-uuid = "7e57c0de-0000-4000-8000-000000000002"
		image = "esp.vfat"
		offset = 2M
	}

	partition rootfs-a {
		partition-type-uuid = "0fc63daf-8483-4772-8e79-3d69d8477de4"
		partition-uuid = "7e57c0de-0000-4000-8000-000000000003"
		image = "rootfs.squashfs"
		size = 768M
	}

	partition rootfs-b {
		partition-type-uuid = "0fc63daf-8483-4772-8e79-3d69d8477de4"
		partition-uuid = "7e57c0de-0000-4000-8000-000000000004"
		size = 768M
	}

	partition data {
		partition-type-uuid = "0fc63daf-8483-4772-8e79-3d69d8477de4"
		partition-uuid = "7e57c0de-0000-4000-8000-000000000005"
		image = "data.ext4"
	}
}
