# x86_64 (D-075): one MBR disk that boots both ways. BIOS: GRUB's boot.img
# in the MBR loads its core image from the gap before the first partition.
# UEFI: the firmware finds the EFI system partition (type 0xEF), which is
# also GRUB's /boot for BIOS, and holds GRUB's environment for the A/B
# choice (D-078). Then: root slots A and B, each with its kernel inside, and
# the data partition.

image esp.vfat {
	vfat {
		label = "TERMOS"
		file EFI {
			image = "esp/EFI"
		}
		file boot {
			image = "esp/boot"
		}
		file grubenv {
			image = "esp/grubenv"
		}
	}
	size = 64M
}

image data.ext4 {
	ext4 {
		label = "termos-data"
		use-mke2fs = true
	}
	size = 512M
}

image disk.img {
	hdimage {
		partition-table-type = "mbr"
		disk-signature = 0x7e57c0de
	}

	partition boot-mbr {
		in-partition-table = "no"
		image = "boot.img"
		offset = 0
		size = 512
		holes = {"(440; 512)"}
	}

	partition grub-core {
		in-partition-table = "no"
		image = "grub.img"
		offset = 512
	}

	partition boot {
		partition-type = 0xef
		bootable = "true"
		image = "esp.vfat"
		offset = 1M
	}

	partition rootfs-a {
		partition-type = 0x83
		image = "rootfs.squashfs"
		size = 768M
	}

	partition rootfs-b {
		partition-type = 0x83
		size = 768M
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
