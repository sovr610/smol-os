# The live ISO (D-080): the system runs from memory, with nothing kept;
# `termos install` writes it to a disk.
set default=0
set timeout=3

menuentry "TermOS (live: try it, then install it with termos install)" {
	linux /boot/bzImage termos.live quiet loglevel=3 console=tty1 console=ttyS0,115200
	initrd /boot/initrd.img
}
