# TermOS on aarch64 UEFI (D-075, D-078, D-124). It picks root slot A or B as
# RAUC's GRUB backend expects (ORDER, <slot>_OK, <slot>_TRY in /grubenv on
# this partition) and loads that slot's kernel from inside its squashfs, so
# an update replaces the kernel and the system together. A slot is tried
# once: if it never reports good, the next boot takes the other one.
set default=0
set timeout=1
set envfile=/grubenv

set ORDER="A B"
set A_OK=0
set B_OK=0
set A_TRY=0
set B_TRY=0
load_env --file $envfile

set any_ok=0
for SLOT in $ORDER; do
	if [ "$SLOT" == "A" ]; then
		INDEX=0
		OK=$A_OK
		TRY=$A_TRY
		A_TRY=1
	fi
	if [ "$SLOT" == "B" ]; then
		INDEX=1
		OK=$B_OK
		TRY=$B_TRY
		B_TRY=1
	fi
	if [ "$OK" -eq 1 -a "$TRY" -eq 0 ]; then
		default=$INDEX
		any_ok=1
		break
	fi
done

# Both slots failed: try the good ones again rather than boot nothing.
if [ "$any_ok" -eq 0 ]; then
	if [ "$A_OK" -eq 1 -a "$A_TRY" -eq 1 ]; then
		A_TRY=0
	fi
	if [ "$B_OK" -eq 1 -a "$B_TRY" -eq 1 ]; then
		B_TRY=0
	fi
fi
save_env --file $envfile A_TRY B_TRY

# The disk this partition is on ("hd0,gpt2" gives "hd0"), and its root
# slots' partition ids: the kernel mounts the slot on this disk, even with
# another TermOS disk in the machine (D-124).
regexp --set=1:disk '^([^,]+),' "$root"
probe --set=a_uuid --part-uuid ($disk,gpt2)
probe --set=b_uuid --part-uuid ($disk,gpt3)
set cmdline="ro rootfstype=squashfs rootwait quiet loglevel=3 panic=10 console=tty1 console=ttyAMA0,115200"

menuentry "TermOS (slot A)" {
	linux ($disk,gpt2)/boot/Image root=PARTUUID=$a_uuid rauc.slot=A $cmdline
}

menuentry "TermOS (slot B)" {
	linux ($disk,gpt3)/boot/Image root=PARTUUID=$b_uuid rauc.slot=B $cmdline
}

# The way back in when the lock screen's password is lost (D-124): nothing
# locks; `termos password` then sets a new one.
menuentry "TermOS without the lock (slot A)" {
	linux ($disk,gpt2)/boot/Image root=PARTUUID=$a_uuid rauc.slot=A termos.nolock $cmdline
}

menuentry "TermOS without the lock (slot B)" {
	linux ($disk,gpt3)/boot/Image root=PARTUUID=$b_uuid rauc.slot=B termos.nolock $cmdline
}
