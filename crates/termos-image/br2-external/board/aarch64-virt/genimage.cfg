# Generic aarch64 UEFI (D-075): the EFI system partition with GRUB and the
# kernel, root slots A and B, the data partition.

image esp.vfat {
	vfat {
		label = "TERMOS"
		file EFI {
			image = "esp/EFI"
		}
		file grubenv {
			image = "esp/grubenv"
		}
	}
	size = 64M
}

image data.ext4 {
	ext4 {
		label = "termos-data"
		use-mke2fs = true
	}
	size = 512M
}

image disk.img {
	hdimage {
		partition-table-type = "mbr"
		disk-signature = 0x7e57c0de
	}

	partition boot {
		partition-type = 0xef
		bootable = "true"
		image = "esp.vfat"
		offset = 1M
	}

	partition rootfs-a {
		partition-type = 0x83
		image = "rootfs.squashfs"
		size = 768M
	}

	partition rootfs-b {
		partition-type = 0x83
		size = 768M
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
