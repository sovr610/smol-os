# Generic aarch64 UEFI (D-075, D-124): a GPT disk with the EFI system
# partition (GRUB), root slots A and B (each with its kernel inside), the
# data partition. The system finds them by their names on the disk it booted
# from; the ids are fixed so builds are reproducible.

image esp.vfat {
	vfat {
		label = "TERMOS"
		file EFI {
			image = "esp/EFI"
		}
		file grubenv {
			image = "esp/grubenv"
		}
	}
	size = 64M
}

image data.ext4 {
	ext4 {
		label = "termos-data"
		use-mke2fs = true
	}
	size = 512M
}

image disk.img {
	hdimage {
		partition-table-type = "gpt"
		disk-uuid = "7e57c0de-0000-4000-8000-000000000000"
	}

	partition boot {
		partition-type-uuid = "c12a7328-f81f-11d2-ba4b-00a0c93ec93b"
		partition-uuid = "7e57c0de-0000-4000-8000-000000000001"
		image = "esp.vfat"
		offset = 1M
	}

	partition rootfs-a {
		partition-type-uuid = "0fc63daf-8483-4772-8e79-3d69d8477de4"
		partition-uuid = "7e57c0de-0000-4000-8000-000000000002"
		image = "rootfs.squashfs"
		size = 768M
	}

	partition rootfs-b {
		partition-type-uuid = "0fc63daf-8483-4772-8e79-3d69d8477de4"
		partition-uuid = "7e57c0de-0000-4000-8000-000000000003"
		size = 768M
	}

	partition data {
		partition-type-uuid = "0fc63daf-8483-4772-8e79-3d69d8477de4"
		partition-uuid = "7e57c0de-0000-4000-8000-000000000004"
		image = "data.ext4"
	}
}
