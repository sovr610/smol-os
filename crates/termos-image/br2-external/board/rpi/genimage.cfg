# Raspberry Pi (D-075, D-078): the firmware's FAT partition (the firmware
# and config.txt at the top; each slot's kernel, device trees, overlays and
# cmdline.txt under slot-a/ and slot-b/; post-image.sh makes boot.vfat),
# root slots A and B, data.

image data.ext4 {
	ext4 {
		label = "termos-data"
		use-mke2fs = true
	}
	size = 512M
}

image disk.img {
	hdimage {
		partition-table-type = "mbr"
		disk-signature = 0x7e57c0de
	}

	partition boot {
		partition-type = 0xc
		bootable = "true"
		image = "boot.vfat"
		offset = 4M
	}

	partition rootfs-a {
		partition-type = 0x83
		image = "rootfs.squashfs"
		size = 768M
	}

	partition rootfs-b {
		partition-type = 0x83
		size = 768M
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
