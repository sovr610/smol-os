[package]
name = "termos-shell"
description = "TermOS desktop shell: launcher, command palette, status bar, notifications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# WASM status-line widgets (D-042, D-050): wasmtime, created only when a
# widget is configured.
wasm-widgets = ["dep:wasmtime", "dep:wasmtime-wasi"]

[dependencies]
getrandom.workspace = true
jiff.workspace = true
nucleo-matcher.workspace = true
serde.workspace = true
serde_json.workspace = true
ratatui-core.workspace = true
termos-apps.workspace = true
ratatui-widgets.workspace = true
termos-core.workspace = true
termos-plugin.workspace = true
termos-render.workspace = true
termos-term.workspace = true
termos-wm.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
unicode-width.workspace = true
wasmtime = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
base64.workspace = true
insta.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[lints]
workspace = true
