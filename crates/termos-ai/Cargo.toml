[package]
name = "termos-ai"
description = "TermOS agent runtime: LLM providers, agent loop, sandboxed tools, MCP client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["tls"]
# HTTPS for providers, `fetch_url` and MCP over HTTP: rustls with ring.
# Without it only plain-HTTP endpoints (local servers) work; it is left out
# only where ring cannot be built, such as clippy for Windows from Linux.
tls = ["rustls/ring"]

[dependencies]
age.workspace = true
futures-util.workspace = true
getrandom.workspace = true
grep.workspace = true
ignore.workspace = true
jiff.workspace = true
keyring.workspace = true
ratatui-core.workspace = true
ratatui-widgets.workspace = true
regex.workspace = true
reqwest.workspace = true
rmcp.workspace = true
rustls.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
shlex.workspace = true
similar.workspace = true
termos-core.workspace = true
termos-render.workspace = true
termos-term.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "process", "io-util", "net", "fs"] }
tracing.workspace = true
unicode-width.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true

[lints]
workspace = true
