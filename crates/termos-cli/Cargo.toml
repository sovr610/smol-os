[package]
name = "termos-cli"
description = "The `termos` command: TermOS entry point, server and client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "termos"
path = "src/main.rs"

[features]
default = ["wasm-widgets", "tls", "candle"]
# WASM status-line widgets (D-050: in every build; the engine starts only
# when a widget is configured).
wasm-widgets = ["termos-shell/wasm-widgets"]
# HTTPS for agents' providers, fetch_url and MCP (D-058); left out only
# where ring cannot be built (clippy for Windows from Linux).
tls = ["termos-ai/tls", "termos-models/tls", "termos-harness/tls"]
# Embedding models in-process (D-067). Like the others, left out by the
# clippy check for Windows run from Linux, which builds no default features.
candle = ["termos-models/candle"]
# The bare-metal console (D-073): `termos --kms` draws on a DRM display and
# reads input through libinput. Linux only; links libinput, libudev,
# libxkbcommon and libseat, so it is on only in the images.
kms = ["termos-render/raster", "dep:bytemuck", "dep:drm", "dep:input", "dep:libseat", "dep:xkbcommon"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
crossterm.workspace = true
futures-util.workspace = true
jiff.workspace = true
secrecy.workspace = true
sha-crypt.workspace = true
serde_json.workspace = true
termos-ai.workspace = true
termos-apps.workspace = true
termos-center.workspace = true
termos-core.workspace = true
termos-devkit.workspace = true
termos-harness.workspace = true
termos-hw.workspace = true
termos-models.workspace = true
termos-render.workspace = true
termos-shell.workspace = true
termos-term.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "net"] }
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
bytemuck = { workspace = true, optional = true }
drm = { workspace = true, optional = true }
input = { workspace = true, optional = true }
libseat = { workspace = true, optional = true }
xkbcommon = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[dev-dependencies]
portable-pty.workspace = true
proptest.workspace = true
tempfile.workspace = true
vt100.workspace = true
rmcp.workspace = true

# Debian and Ubuntu (`cargo deb --no-build`, D-126): the release's binary,
# the shell completions and the man page, which the release job makes into
# target/assets first.
[package.metadata.deb]
name = "termos"
maintainer = "TermOS contributors <noreply@github.com>"
copyright = "TermOS contributors"
license-file = ["../../LICENSE", "0"]
extended-description = """\
TermOS is a terminal-first desktop: tiling and floating windows, a \
command palette, file manager, system monitor and AI agents with a \
sandbox, running inside any terminal."""
section = "utils"
priority = "optional"
depends = "libc6 (>= 2.31)"
recommends = "curl, git"
suggests = "bubblewrap"
assets = [
    ["target/release/termos", "usr/bin/", "755"],
    ["../../target/assets/termos.bash", "usr/share/bash-completion/completions/termos", "644"],
    ["../../target/assets/_termos", "usr/share/zsh/vendor-completions/_termos", "644"],
    ["../../target/assets/termos.fish", "usr/share/fish/vendor_completions.d/termos.fish", "644"],
    ["../../target/assets/termos.1.gz", "usr/share/man/man1/termos.1.gz", "644"],
]

# Fedora (`cargo generate-rpm`, D-126): the same files.
[package.metadata.generate-rpm]
name = "termos"
summary = "Terminal-first desktop: windows, AI agents and local models in any terminal"
license = "GPL-3.0-or-later"
assets = [
    { source = "target/release/termos", dest = "/usr/bin/termos", mode = "755" },
    { source = "../../target/assets/termos.bash", dest = "/usr/share/bash-completion/completions/termos", mode = "644" },
    { source = "../../target/assets/_termos", dest = "/usr/share/zsh/site-functions/_termos", mode = "644" },
    { source = "../../target/assets/termos.fish", dest = "/usr/share/fish/vendor_completions.d/termos.fish", mode = "644" },
    { source = "../../target/assets/termos.1.gz", dest = "/usr/share/man/man1/termos.1.gz", mode = "644", doc = true },
    { source = "../../LICENSE", dest = "/usr/share/licenses/termos/LICENSE", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
glibc = ">= 2.31"

[lints]
workspace = true
