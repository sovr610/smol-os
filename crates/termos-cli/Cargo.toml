[package]
name = "termos-cli"
description = "The `termos` command: TermOS entry point, server and client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "termos"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
crossterm.workspace = true
futures-util.workspace = true
serde_json.workspace = true
termos-core.workspace = true
termos-render.workspace = true
termos-shell.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
portable-pty.workspace = true
tempfile.workspace = true
vt100.workspace = true

[lints]
workspace = true
