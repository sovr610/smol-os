name: Images

# Bare-metal images (M8, D-074 to D-076): Buildroot builds each image with
# TermOS's console in it, and QEMU boots the virtual-machine ones to the
# desktop. Builds take about an hour, so this runs when the image, the
# console or this workflow changes, weekly, and on demand (where the Pi
# images can be asked for too).

on:
  push:
    paths:
      - "crates/termos-image/**"
      - "crates/termos-cli/src/kms/**"
      - "crates/termos-cli/src/update.rs"
      - "crates/termos-render/src/raster/**"
      - "xtask/**"
      - ".github/workflows/images.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      targets:
        description: 'Targets, as a JSON list (`cargo xtask image list`), e.g. ["x86_64", "aarch64-virt", "rpi4"]'
        default: '["x86_64", "aarch64-virt"]'

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  image:
    name: Image (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(github.event.inputs.targets || '["x86_64", "aarch64-virt"]') }}
    steps:
      - uses: actions/checkout@v5
      # Buildroot's output, the kernel and a release build of termos need
      # more than the runner's free space.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-unknown-linux-gnu
      - name: Buildroot and QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential rsync bc cpio unzip file wget python3 \
            qemu-system-x86 qemu-system-arm qemu-utils ovmf qemu-efi-aarch64
          # QEMU may use KVM (x86_64 guests on this runner).
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      # Buildroot's downloads (the toolchain, the kernel, the packages):
      # restored from the last run and saved even when the build fails, so
      # the next attempt does not fetch them again.
      - name: Restore downloads
        uses: actions/cache/restore@v4
        with:
          path: target/image/dl
          key: buildroot-dl-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: buildroot-dl-${{ matrix.target }}-
      - name: Build
        run: cargo xtask image build ${{ matrix.target }} --legal-info
      - name: Save downloads
        if: always()
        uses: actions/cache/save@v4
        with:
          path: target/image/dl
          key: buildroot-dl-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Every firmware boots the image; on x86_64 (KVM) the same disk then
      # goes through an A/B update and a failed one (D-078).
      - name: Boot in QEMU
        if: matrix.target == 'x86_64' || matrix.target == 'aarch64-virt'
        run: cargo xtask image boot ${{ matrix.target }} --firmware all ${{ matrix.target == 'x86_64' && '--update' || '' }}
      - name: Pack
        if: always()
        run: |
          mkdir -p dist boot
          cp target/image/${{ matrix.target }}-boot/*.png target/image/${{ matrix.target }}-boot/serial-*.log boot/ 2>/dev/null || true
          if [ -f target/image/${{ matrix.target }}/images/disk.img ]; then
            zstd -q -T0 -10 target/image/${{ matrix.target }}/images/disk.img -o dist/termos-${{ matrix.target }}.img.zst
          fi
          # The update bundle (signed with this run's development keys).
          cp target/image/${{ matrix.target }}/images/termos-${{ matrix.target }}-*.raucb dist/ 2>/dev/null || true
          rm -f dist/*-update-test.raucb dist/*-broken.raucb
          # The license report (manifests and license texts) without the
          # source archives it gathers, about 1 GB: those are Buildroot's
          # downloads, kept in the cache above.
          if [ -d target/image/${{ matrix.target }}/legal-info ]; then
            tar -C target/image/${{ matrix.target }} -cJf dist/legal-info-${{ matrix.target }}.tar.xz \
              --exclude=legal-info/sources --exclude=legal-info/host-sources legal-info
          fi
          ls -la boot dist
      # Screenshots and serial logs on their own, small, to look at first.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-${{ matrix.target }}
          path: boot/
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-${{ matrix.target }}
          path: dist/
          retention-days: 14
          if-no-files-found: warn
