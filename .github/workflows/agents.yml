name: Agent CLIs

# Claude Code and Codex CLI installed by TermOS for real (ROADMAP M10d,
# D-094): `termos agent install` downloads each vendor's own program,
# checks it against the SHA-256 the vendor publishes (Claude Code's
# release manifest; GitHub's asset digest for Codex) and registers
# TermOS's MCP server with it; a second account of each (M11a) is
# separate, registered and followed by TermOS's shims. Each CLI then runs
# and connects to the server (an MCP handshake, which TermOS's audit log
# records): Claude Code through `claude mcp list`, Codex through `codex
# exec` against a stand-in model server that refuses at once (Codex
# starts its MCP servers first). TermOS's skills (M11b, D-098) are
# installed with them, and each CLI lists them to the model: the
# stand-in records what each sends (Claude Code gets a short answer, with
# a fixture key, in each account).
# No account and no API key: nothing here signs in. Runs when the
# installer, the MCP server or the skills change, nightly (the vendors
# release often) and on demand.

on:
  schedule:
    - cron: "41 5 * * *"
  push:
    paths:
      - "crates/termos-devkit/src/cli_agents.rs"
      - "crates/termos-cli/src/coding_agents.rs"
      - "crates/termos-ai/src/mcp_server.rs"
      - "crates/termos-devkit/src/accounts.rs"
      - "crates/termos-cli/src/accounts_cmd.rs"
      - "crates/termos-cli/src/shim.rs"
      - "crates/termos-devkit/src/skills.rs"
      - "crates/termos-devkit/skills/**"
      - "crates/termos-cli/src/skills_cmd.rs"
      - ".github/scripts/refusing-model.py"
      - ".github/scripts/skills-listed.py"
      - ".github/scripts/claude-skills.sh"
      - ".github/workflows/agents.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agents-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  install:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      # GitHub's API is rate-limited per runner address without a token.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      # Where the programs go. TermOS's state (its audit logs) stays in
      # the default place, which the MCP servers the CLIs start also use.
      - name: Folders
        run: |
          echo "XDG_DATA_HOME=$RUNNER_TEMP/data" >> "$GITHUB_ENV"
          echo "CODEX_HOME=$RUNNER_TEMP/codex" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build
        run: cargo build --locked -p termos-cli --no-default-features
      - name: Install Claude Code and Codex CLI
        run: |
          termos=target/debug/termos
          $termos agent install claude
          $termos agent install codex
          $termos agent status | tee status.txt
          grep -c "TermOS's MCP server: registered" status.txt | grep -qx 2
          # Their skills: three, in Claude Code's folder and the shared one.
          $termos skills status | tee skills.txt
          grep -cE "^  termos[a-z-]* +installed$" skills.txt | grep -qx 6
      - name: They run
        run: |
          bin="$XDG_DATA_HOME/termos/bin"
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          "$bin/claude$ext" --version
          "$bin/codex$ext" --version
      - name: Claude Code connects to TermOS's MCP server
        env:
          DISABLE_AUTOUPDATER: "1"
        run: |
          bin="$XDG_DATA_HOME/termos/bin"
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          "$bin/claude$ext" mcp list | tee mcp.txt
          grep -i "termos" mcp.txt | grep -qi "connected"
          bash .github/scripts/mcp-audited.sh claude
      - name: Claude Code lists TermOS's skills
        run: |
          bin="$XDG_DATA_HOME/termos/bin"
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          bash .github/scripts/claude-skills.sh "$bin/claude$ext" 8766
      - name: Codex CLI connects to TermOS's MCP server and lists its skills
        run: |
          bin="$XDG_DATA_HOME/termos/bin"
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          "$bin/codex$ext" mcp list | tee mcp.txt
          grep -q "termos" mcp.txt
          # A model server that refuses every request.
          py=$(command -v python3 || command -v python)
          "$py" .github/scripts/refusing-model.py 8765 "$RUNNER_TEMP/codex-requests.jsonl" &
          # Its settings first: top-level keys before any table.
          cfg="$CODEX_HOME/config.toml"
          { printf 'model = "fixture-model"\nmodel_provider = "fixture"\n\n'
            cat "$cfg"
            printf '\n[model_providers.fixture]\nname = "fixture"\nbase_url = "http://127.0.0.1:8765/v1"\n'
          } > "$cfg.new" && mv "$cfg.new" "$cfg"
          cat "$cfg"
          mkdir -p "$RUNNER_TEMP/work" && cd "$RUNNER_TEMP/work"
          "$bin/codex$ext" exec --skip-git-repo-check "say hello" < /dev/null > codex.txt 2>&1 &
          pid=$!
          for _ in $(seq 1 120); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null || true
          cat codex.txt
          cd "$GITHUB_WORKSPACE"
          bash .github/scripts/mcp-audited.sh codex
          # Its request to the model lists TermOS's skills (~/.agents/skills).
          "$py" .github/scripts/skills-listed.py "$RUNNER_TEMP/codex-requests.jsonl" /v1/
      - name: A second account of each, separate and registered
        env:
          DISABLE_AUTOUPDATER: "1"
        run: |
          termos=target/debug/termos
          bin="$XDG_DATA_HOME/termos/bin"
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          $termos account add claude second --label "Second" --no-sign-in
          $termos account add codex second --no-sign-in
          $termos account list | tee accounts.txt
          grep -q "second" accounts.txt
          # Each account has its own settings, with TermOS's server.
          second="$XDG_DATA_HOME/termos/accounts/claude/second"
          test -f "$second/.claude.json"
          grep -q '"termos"' "$second/.claude.json"
          grep -q "mcp_servers.termos" "$XDG_DATA_HOME/termos/accounts/codex/second/config.toml"
          # `claude` follows the account in use, through TermOS's shim.
          $termos account use claude second
          "$bin/claude$ext" mcp list | tee mcp.txt
          grep -i "termos" mcp.txt | grep -qi "connected"
          # The second account lists TermOS's skills too.
          bash .github/scripts/claude-skills.sh "$bin/claude$ext" 8767
          $termos account use codex second
          "$bin/codex$ext" mcp list | tee mcp.txt
          grep -q "termos" mcp.txt
          $termos account use claude default
          # Claude Code's limits, as its status line passes them.
          $termos account statusline claude on
          echo '{"model":{"display_name":"Fixture"},"rate_limits":{"five_hour":{"used_percentage":42.5,"resets_at":1800000000}}}' \
            | CLAUDE_CONFIG_DIR="$second" $termos agent statusline | tee line.txt
          grep -q "5 h 42%" line.txt
          $termos account statusline claude off
          $termos account remove claude second --yes
          $termos account remove codex second --yes
      - name: Update and remove
        run: |
          termos=target/debug/termos
          $termos agent update | tee update.txt
          grep -q "is installed" update.txt
          $termos agent remove codex
          $termos agent status | tee status.txt
          grep -q "^Codex CLI *not installed by TermOS" status.txt
          $termos mcp unregister codex
          if grep -q "mcp_servers.termos" "$CODEX_HOME/config.toml"; then
            echo "still registered"; exit 1
          fi
