name: Agent CLIs

# Claude Code and Codex CLI installed by TermOS for real (ROADMAP M10d,
# D-094): `termos agent install` downloads each vendor's own program,
# checks it against the SHA-256 the vendor publishes (Claude Code's
# release manifest; GitHub's asset digest for Codex) and registers
# TermOS's MCP server with it; a second account of each (M11a) is
# separate, registered and followed by TermOS's shims. Each CLI then runs
# and connects to the server (an MCP handshake, which TermOS's audit log
# records): Claude Code through `claude mcp list`, Codex through `codex
# exec` against a stand-in model server that refuses at once (Codex
# starts its MCP servers first). TermOS's skills (M11b, D-098) are
# installed with them, and each CLI lists them to the model: the
# stand-in records what each sends (Claude Code gets a short answer, with
# a fixture key, in each account). The harness (M11c, D-100) runs a plan
# through both: Claude Code plans and writes, Codex is tried for the
# review and refused, and the review falls back to Claude Code. Gemini
# CLI (M11d, D-112) is installed the same way (Google's bundle, checked
# against GitHub's digest, run by Node.js from mise), with TermOS's server
# in its settings and an account of its own; each CLI is asked who each
# account is signed in as (no one, here). In a git repository (M12a,
# D-113) the harness gives the plan a branch and each edit a worktree of
# its own: the CLIs work there.
# No account and no API key: nothing here signs in. Runs when the
# installer, the MCP server or the skills change, nightly (the vendors
# release often) and on demand.

on:
  schedule:
    - cron: "41 5 * * *"
  push:
    paths:
      - "crates/termos-devkit/src/cli_agents.rs"
      - "crates/termos-cli/src/coding_agents.rs"
      - "crates/termos-ai/src/mcp_server.rs"
      - "crates/termos-devkit/src/accounts.rs"
      - "crates/termos-devkit/src/conversations.rs"
      - "crates/termos-center/src/theirs.rs"
      - "crates/termos-cli/src/accounts_cmd.rs"
      - "crates/termos-cli/src/shim.rs"
      - "crates/termos-devkit/src/skills.rs"
      - "crates/termos-devkit/skills/**"
      - "crates/termos-cli/src/skills_cmd.rs"
      - ".github/scripts/refusing-model.py"
      - ".github/scripts/skills-listed.py"
      - ".github/scripts/claude-skills.sh"
      - "crates/termos-harness/**"
      - "crates/termos-cli/src/harness_cmd.rs"
      - "crates/termos-devkit/src/worktrees.rs"
      - "crates/termos-cli/src/worktree_cmd.rs"
      - "crates/termos-cli/src/agent_hooks.rs"
      - ".github/workflows/agents.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agents-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  install:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      # GitHub's API is rate-limited per runner address without a token.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      # Where the programs go. TermOS's state (its audit logs) stays in
      # the default place, which the MCP servers the CLIs start also use.
      - name: Folders
        run: |
          echo "XDG_DATA_HOME=$RUNNER_TEMP/data" >> "$GITHUB_ENV"
          echo "CODEX_HOME=$RUNNER_TEMP/codex" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build
        run: cargo build --locked -p termos-cli --no-default-features
      - name: Install Claude Code and Codex CLI
        run: |
          termos=target/debug/termos
          $termos agent install claude
          $termos agent install codex
          $termos agent status | tee status.txt
          grep -c "TermOS's MCP server: registered" status.txt | grep -qx 2
          # Their skills: three, in Claude Code's folder and the shared one.
          $termos skills status | tee skills.txt
          grep -cE "^  termos[a-z-]* +installed$" skills.txt | grep -qx 6
      - name: They run
        run: |
          bin="$XDG_DATA_HOME/termos/bin"
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          "$bin/claude$ext" --version
          "$bin/codex$ext" --version
      - name: Claude Code connects to TermOS's MCP server
        env:
          DISABLE_AUTOUPDATER: "1"
        run: |
          bin="$XDG_DATA_HOME/termos/bin"
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          "$bin/claude$ext" mcp list | tee mcp.txt
          grep -i "termos" mcp.txt | grep -qi "connected"
          bash .github/scripts/mcp-audited.sh claude
      - name: Claude Code lists TermOS's skills
        run: |
          bin="$XDG_DATA_HOME/termos/bin"
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          bash .github/scripts/claude-skills.sh "$bin/claude$ext" 8766
      # TermOS's hooks (D-116): the real CLIs run them, with the JSON TermOS
      # reads (TERMOS_HOOK_LOG records what reached `termos agent event`).
      - name: Claude Code runs TermOS's hooks
        env:
          DISABLE_AUTOUPDATER: "1"
        run: |
          termos=target/debug/termos
          bin="$XDG_DATA_HOME/termos/bin"
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          $termos agent hooks claude | tee hooks.txt
          export TERMOS_HOOK_LOG="$RUNNER_TEMP/claude-hooks.jsonl"
          rm -f "$TERMOS_HOOK_LOG"
          bash .github/scripts/claude-skills.sh "$bin/claude$ext" 8769
          cat "$TERMOS_HOOK_LOG"
          grep '"kind":"started"' "$TERMOS_HOOK_LOG" | grep -q '"cli":"claude"'
          grep '"kind":"working"' "$TERMOS_HOOK_LOG" | grep -q '"cli":"claude"'
      - name: Codex CLI connects to TermOS's MCP server and lists its skills
        run: |
          bin="$XDG_DATA_HOME/termos/bin"
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          "$bin/codex$ext" mcp list | tee mcp.txt
          grep -q "termos" mcp.txt
          # A model server that refuses every request.
          py=$(command -v python3 || command -v python)
          "$py" .github/scripts/refusing-model.py 8765 "$RUNNER_TEMP/codex-requests.jsonl" &
          # Its settings first: top-level keys before any table.
          cfg="$CODEX_HOME/config.toml"
          { printf 'model = "fixture-model"\nmodel_provider = "fixture"\n\n'
            cat "$cfg"
            printf '\n[model_providers.fixture]\nname = "fixture"\nbase_url = "http://127.0.0.1:8765/v1"\n'
          } > "$cfg.new" && mv "$cfg.new" "$cfg"
          cat "$cfg"
          mkdir -p "$RUNNER_TEMP/work" && cd "$RUNNER_TEMP/work"
          "$bin/codex$ext" exec --skip-git-repo-check "say hello" < /dev/null > codex.txt 2>&1 &
          pid=$!
          for _ in $(seq 1 120); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null || true
          cat codex.txt
          # Its hooks, which Codex runs only once trusted: trusted here for
          # the run (where this Codex has the flag).
          if "$bin/codex$ext" exec --help | grep -q -- --dangerously-bypass-hook-trust; then
            export TERMOS_HOOK_LOG="$RUNNER_TEMP/codex-hooks.jsonl"
            rm -f "$TERMOS_HOOK_LOG"
            "$bin/codex$ext" exec --dangerously-bypass-hook-trust --skip-git-repo-check "say hello" < /dev/null > codex-hooks.txt 2>&1 &
            pid=$!
            for _ in $(seq 1 120); do kill -0 $pid 2>/dev/null || break; sleep 1; done
            kill $pid 2>/dev/null || true
            cat codex-hooks.txt
            cat "$TERMOS_HOOK_LOG"
            grep '"kind":"started"' "$TERMOS_HOOK_LOG" | grep -q '"cli":"codex"'
            unset TERMOS_HOOK_LOG
          else
            echo "this Codex has no --dangerously-bypass-hook-trust; its hooks are not run here"
          fi
          cd "$GITHUB_WORKSPACE"
          bash .github/scripts/mcp-audited.sh codex
          # Its request to the model lists TermOS's skills (~/.agents/skills).
          "$py" .github/scripts/skills-listed.py "$RUNNER_TEMP/codex-requests.jsonl" v1/
      - name: A second account of each, separate and registered
        env:
          DISABLE_AUTOUPDATER: "1"
        run: |
          termos=target/debug/termos
          bin="$XDG_DATA_HOME/termos/bin"
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          $termos account add claude second --label "Second" --no-sign-in
          $termos account add codex second --no-sign-in
          $termos account list | tee accounts.txt
          grep -q "second" accounts.txt
          # Each account has its own settings, with TermOS's server.
          second="$XDG_DATA_HOME/termos/accounts/claude/second"
          test -f "$second/.claude.json"
          grep -q '"termos"' "$second/.claude.json"
          grep -q "mcp_servers.termos" "$XDG_DATA_HOME/termos/accounts/codex/second/config.toml"
          # Who each is signed in as, asked of the CLIs themselves. Keys
          # in the environment do not reach TermOS's accounts (D-112).
          ANTHROPIC_API_KEY=fixture-key CODEX_API_KEY=fixture-key \
            $termos account status | tee who.txt
          grep -cE "^  second +not signed in" who.txt | grep -qx 2
          # `claude` follows the account in use, through TermOS's shim.
          $termos account use claude second
          "$bin/claude$ext" mcp list | tee mcp.txt
          grep -i "termos" mcp.txt | grep -qi "connected"
          ANTHROPIC_API_KEY=fixture-key "$bin/claude$ext" auth status | tee auth.txt || true
          grep -qiE '"loggedIn": *false|not logged in' auth.txt
          # The second account's folder lists TermOS's skills too (Claude
          # Code itself, pointed there: a fixture key stays out of the shim).
          real=$($termos agent status | sed -n 's/^Claude Code .*(\(.*\))$/\1/p')
          [ "$RUNNER_OS" = Windows ] && real=$(cygpath -u "$real")
          CLAUDE_CONFIG_DIR="$second" bash .github/scripts/claude-skills.sh "$real" 8767
          $termos account use codex second
          "$bin/codex$ext" mcp list | tee mcp.txt
          grep -q "termos" mcp.txt
          $termos account use claude default
          # Claude Code's limits, as its status line passes them.
          $termos account statusline claude on
          echo '{"model":{"display_name":"Fixture"},"rate_limits":{"five_hour":{"used_percentage":42.5,"resets_at":1800000000}}}' \
            | CLAUDE_CONFIG_DIR="$second" $termos agent statusline | tee line.txt
          grep -q "5 h 42%" line.txt
          $termos account statusline claude off
          $termos account remove claude second --yes
          $termos account remove codex second --yes
      - name: Gemini CLI, installed by TermOS, with accounts
        run: |
          termos=target/debug/termos
          bin="$XDG_DATA_HOME/termos/bin"
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          $termos agent install gemini
          $termos agent status | tee status.txt
          grep -A3 "^Gemini CLI" status.txt | grep -q "TermOS's MCP server: registered"
          "$bin/gemini$ext" --version
          $termos account add gemini second --no-sign-in
          second="$XDG_DATA_HOME/termos/accounts/gemini/second/.gemini"
          grep -q '"termos"' "$second/settings.json"
          grep -q '"enableAutoUpdate": false' "$second/settings.json"
          $termos account status gemini | tee who.txt
          grep -qE "^  second +not signed in" who.txt
          $termos account remove gemini second --yes
          $termos agent remove gemini
      - name: The harness runs a plan through Claude Code and Codex
        env:
          DISABLE_AUTOUPDATER: "1"
        run: |
          termos=target/debug/termos
          py=$(command -v python3 || command -v python)
          # Claude Code talks to a stand-in that answers the planner with a
          # small plan (a fixture key, no account); Codex to one that
          # refuses (its settings from the step above). The review goes to
          # Codex first (another backend than the author), fails, and falls
          # back to Claude Code.
          "$py" .github/scripts/refusing-model.py 8768 "$RUNNER_TEMP/harness-requests.jsonl" &
          "$py" .github/scripts/refusing-model.py 8765 &
          sleep 2
          mkdir -p "$RUNNER_TEMP/project"
          $termos harness status --project "$RUNNER_TEMP/project" | tee status.txt
          grep -q "review → frontier: Claude Code" status.txt
          ANTHROPIC_BASE_URL=http://127.0.0.1:8768 ANTHROPIC_API_KEY=fixture-key \
            CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1 \
            $termos harness run --yes --project "$RUNNER_TEMP/project" "write a note" < /dev/null | tee harness.txt
          grep -q "Plan: Write a note" harness.txt
          grep '^\[t1\]' harness.txt | grep -q "done in"
          grep '^\[t2\]' harness.txt | grep -q "Codex CLI: "
          grep '^\[t2\]' harness.txt | grep -q "done in"
          grep -q "2 of 2 tasks done" harness.txt
          # Claude Code was given each task.
          grep -q "This is task t1 (coding)" "$RUNNER_TEMP/harness-requests.jsonl"
          grep -q "This is task t2 (review)" "$RUNNER_TEMP/harness-requests.jsonl"
          # Every hand-off is in a log that verifies.
          id=$(sed -n 's/^Hand-offs: `termos audit show \(.*\)`$/\1/p' harness.txt)
          $termos audit show "$id" | tee handoffs.txt
          grep -q "fell-back\|failed" handoffs.txt
          $termos audit verify
      - name: In a git repository the harness works in worktrees
        env:
          DISABLE_AUTOUPDATER: "1"
        run: |
          termos=target/debug/termos
          py=$(command -v python3 || command -v python)
          # The same stand-ins (Codex's, from the step above, still runs);
          # the project is a repository now (D-113): the plan gets a
          # branch, its edit a worktree of its own.
          "$py" .github/scripts/refusing-model.py 8770 "$RUNNER_TEMP/worktree-requests.jsonl" &
          sleep 2
          proj="$RUNNER_TEMP/repo"
          mkdir -p "$proj"
          git -C "$proj" init -q -b main
          git -C "$proj" config user.name CI
          git -C "$proj" config user.email ci@example.com
          echo hello > "$proj/README.md"
          git -C "$proj" add -A
          git -C "$proj" commit -qm first
          ANTHROPIC_BASE_URL=http://127.0.0.1:8770 ANTHROPIC_API_KEY=fixture-key \
            CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1 \
            $termos harness run --yes --project "$proj" "write a note" < /dev/null | tee harness.txt
          grep -q "2 of 2 tasks done" harness.txt
          grep -q "The result is on branch termos/plan-" harness.txt
          # Claude Code worked in the edit's own worktree, the review in
          # the plan's.
          grep "This is task t1 (coding)" "$RUNNER_TEMP/worktree-requests.jsonl" | grep -q 'plan-[0-9-]*[0-9a-f]*-t1'
          termos="$GITHUB_WORKSPACE/target/debug/termos"
          cd "$proj"
          $termos worktree list | tee list.txt
          grep -c "^  plan-" list.txt | grep -qx 1
          plan=$(sed -n 's/^  \(plan-[^ ]*\) .*/\1/p' list.txt)
          $termos worktree status "$plan"
          $termos worktree discard "$plan" --yes
          $termos worktree forget "$plan"
      - name: Update and remove
        run: |
          termos=target/debug/termos
          $termos agent update | tee update.txt
          grep -q "is installed" update.txt
          $termos agent remove codex
          $termos agent status | tee status.txt
          grep -q "^Codex CLI *not installed by TermOS" status.txt
          $termos mcp unregister codex
          if grep -q "mcp_servers.termos" "$CODEX_HOME/config.toml"; then
            echo "still registered"; exit 1
          fi
