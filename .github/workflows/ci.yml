name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    name: Lint (fmt, repo checks, cargo-deny)
    runs-on: ubuntu-24.04
    # A hang must not hold a runner for the default six hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      # Reads rust-toolchain.toml (pinned 1.97.0 + rustfmt/clippy), enables the
      # Swatinem cache and sets RUSTFLAGS=-D warnings.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: rustfmt
        run: cargo fmt --all --check
      - name: Work markers, ROADMAP sync, SPDX headers
        run: cargo xtask check-todos
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo-deny (licenses, advisories, bans, sources)
        run: cargo deny check
      # Windows-only code is type-checked here too, so most Windows
      # breakage shows up without waiting for the Windows runner. Crates
      # whose tests build C code for the target (criterion) are checked
      # without their tests, and the WASM widgets (wasmtime builds C for
      # Windows) are left out; the Windows job checks and runs all of it.
      # Keep the crate list in sync with CROSS_TEST_CRATES in
      # xtask/src/main.rs.
      - name: clippy for Windows
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo clippy --workspace --lib --bins --no-default-features --locked --target x86_64-pc-windows-msvc -- -D warnings
          cargo clippy -p termos-core -p termos-devkit -p termos-hw -p termos-term -p termos-wm -p termos-plugin -p termos-apps -p termos-shell -p termos-cli -p termos-ai -p termos-models --all-targets --no-default-features --locked --target x86_64-pc-windows-msvc -- -D warnings

  test:
    name: Clippy + test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # A hang must not hold a runner for the default six hours.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-latest
          - name: windows-x86_64
            os: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # The agent sandbox (D-061): bubblewrap, and user namespaces, which
      # Ubuntu 24.04 restricts through AppArmor by default. The sandbox
      # tests then fail instead of skipping when it does not work.
      # The bare-metal console (`kms` feature, D-073) links libinput,
      # libudev, libxkbcommon and libseat, and its tests compile real XKB
      # keymaps (xkb-data).
      - name: Agent sandbox and console libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap libinput-dev libudev-dev libxkbcommon-dev libseat-dev xkb-data
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          echo "TERMOS_REQUIRE_SANDBOX=1" >> "$GITHUB_ENV"
      # Clippy runs on every platform so cfg-gated (Linux-only / macOS-only
      # / Windows-only) code is linted where it compiles.
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # --no-fail-fast: one run shows every failing test binary, which
      # matters most on the platform nobody tests locally.
      - name: test
        run: cargo test --workspace --all-features --locked --no-fail-fast
      - name: smoke
        run: cargo run --locked -p termos-cli -- --version
      # The real daemon, started and driven by the CLI the way a user would.
      - name: daemon smoke
        shell: bash
        run: |
          cargo build --locked -p termos-cli
          TERMOS_BIN=target/debug/termos ./.github/scripts/daemon-smoke.sh

  cross:
    name: Cross-build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    # A hang must not hold a runner for the default six hours.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
          # Static builds that run on any Linux (D-079).
          - aarch64-unknown-linux-musl
          - x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      # cargo-zigbuild uses zig as the cross linker; `python3 -m ziglang` is
      # one of the locations it probes.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install zig
        run: python3 -m pip install ziglang==0.17.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      # The .2.31 suffix pins the glibc floor of the produced binary; musl
      # builds are static.
      - name: Build termos
        run: cargo zigbuild --release --locked -p termos-cli --target ${{ matrix.target }}${{ endsWith(matrix.target, '-gnu') && '.2.31' || '' }}
      - name: Inspect binary
        run: file target/${{ matrix.target }}/release/termos
      # Test builds: a tar keeps the executable bit, which zip would lose.
      - name: Package test build
        id: package
        shell: bash
        run: |
          arch="${{ matrix.target }}"; arch="${arch%%-*}"
          case "${{ matrix.target }}" in
          *-musl) flavour="-musl"; needs="static: any Linux" ;;
          *) flavour=""; needs="glibc 2.31 or newer" ;;
          esac
          name="termos-${GITHUB_SHA::7}-linux-${arch}${flavour}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/termos" "dist/$name/"
          ./.github/scripts/buildinfo.sh "${{ matrix.target }} ($needs)" > "dist/$name/BUILDINFO.txt"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/${{ steps.package.outputs.name }}.tar.gz
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

  # The Linux test builds, downloaded and run on matching machines: proves
  # the glibc 2.31 cross-builds start and work.
  artifact-smoke:
    name: Test build smoke (linux-${{ matrix.arch }})
    needs: cross
    runs-on: ${{ matrix.os }}
    # A hang must not hold a runner for the default six hours.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-24.04
          - arch: aarch64
            os: ubuntu-24.04-arm
          - arch: x86_64-musl
            os: ubuntu-24.04
          - arch: aarch64-musl
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: termos-*-linux-${{ matrix.arch }}
          path: dist
          merge-multiple: true
      - name: Run the test build
        shell: bash
        run: |
          tar -C dist -xzf dist/termos-*-linux-${{ matrix.arch }}.tar.gz
          bin=$(echo dist/termos-*-linux-${{ matrix.arch }}/termos)
          "$bin" --version
          cat dist/termos-*-linux-${{ matrix.arch }}/BUILDINFO.txt
          case "${{ matrix.arch }}" in *-musl) file "$bin" | grep -Eq 'static(ally|-pie) linked' ;; esac
          TERMOS_BIN="$bin" ./.github/scripts/daemon-smoke.sh

  package-macos:
    name: Test build (macos-arm64)
    runs-on: macos-latest
    # A hang must not hold a runner for the default six hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build termos
        run: cargo build --release --locked -p termos-cli
      - name: Package test build
        id: package
        shell: bash
        run: |
          name="termos-${GITHUB_SHA::7}-macos-arm64"
          mkdir -p "dist/$name"
          cp target/release/termos "dist/$name/"
          ./.github/scripts/buildinfo.sh "aarch64-apple-darwin (macOS 11 or newer)" > "dist/$name/BUILDINFO.txt"
          "dist/$name/termos" --version
          TERMOS_BIN="dist/$name/termos" ./.github/scripts/daemon-smoke.sh
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/${{ steps.package.outputs.name }}.tar.gz
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

  package-windows:
    name: Test build (windows-x86_64)
    runs-on: windows-latest
    # A hang must not hold a runner for the default six hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # The setup action sets RUSTFLAGS, which overrides .cargo/config.toml's
      # target rustflags: link the C runtime statically here explicitly, so
      # the build runs without the Visual C++ redistributable.
      - name: Build termos
        env:
          RUSTFLAGS: -D warnings -C target-feature=+crt-static
        run: cargo build --release --locked -p termos-cli
      - name: Package test build
        id: package
        shell: bash
        run: |
          name="termos-${GITHUB_SHA::7}-windows-x86_64"
          mkdir -p "dist/$name"
          cp target/release/termos.exe "dist/$name/"
          ./.github/scripts/buildinfo.sh "x86_64-pc-windows-msvc (Windows 10 1809 or newer, Windows Terminal)" > "dist/$name/BUILDINFO.txt"
          "dist/$name/termos.exe" --version
          TERMOS_BIN="dist/$name/termos.exe" ./.github/scripts/daemon-smoke.sh
          echo "name=$name" >> "$GITHUB_OUTPUT"
      # upload-artifact zips the directory: the download is a .zip holding
      # termos.exe and BUILDINFO.txt.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/${{ steps.package.outputs.name }}
          retention-days: 14
          if-no-files-found: error

  fuzz:
    name: Fuzz smoke (nightly, 60 s per target)
    runs-on: ubuntu-24.04
    # A hang must not hold a runner for the default six hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      # cargo-fuzz needs nightly; the pinned stable toolchain is overridden
      # with `+nightly` only for this job.
      - name: Install nightly
        run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      # The prebuilt cargo-fuzz is a musl binary and would default to the
      # musl target, which the sanitizer cannot use; pin the gnu target.
      - name: Run fuzz targets
        working-directory: fuzz
        run: |
          for target in vt_advance config_parse keyspec_parse proto_decode caps_reply sixel_decode apc_dcs_intercept markdown_layout sse_parse gguf_parse ppm_parse; do
            cargo +nightly fuzz run "$target" --target x86_64-unknown-linux-gnu -- -max_total_time=60
          done

  perf:
    name: Performance budgets (release)
    runs-on: ubuntu-24.04
    # A hang must not hold a runner for the default six hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Latency, idle CPU, memory, flood throughput
        run: cargo xtask perf 30

  # The static musl build must keep the same budgets (D-079).
  perf-musl:
    name: Performance budgets (release, static musl)
    runs-on: ubuntu-24.04
    # A hang must not hold a runner for the default six hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-unknown-linux-musl
      - name: musl's C compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: Latency, idle CPU, memory, flood throughput
        run: cargo xtask perf 30 --target x86_64-unknown-linux-musl

  # Every language, on both architectures, runs nightly and when the
  # developer environment changes (languages.yml); this quick subset runs
  # on every push.
  languages-quick:
    name: Languages (quick)
    uses: ./.github/workflows/languages.yml
    with:
      languages: '["rust", "python", "go"]'
      runners: '["ubuntu-24.04"]'

  widget-sample:
    name: WASM widget sample (built from source)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-wasip2
      # The tests normally use the build kept in tests/fixtures; here they
      # run against a fresh build of examples/widgets/pomodoro, so the
      # fixture can never drift from its source.
      - name: Build the sample widget
        run: cargo build --release --locked --target wasm32-wasip2 --manifest-path examples/widgets/pomodoro/Cargo.toml
      - name: Widget tests against the fresh build
        run: |
          export TERMOS_TEST_WIDGET="$PWD/examples/widgets/pomodoro/target/wasm32-wasip2/release/termos_widget_pomodoro.wasm"
          cargo test -p termos-shell --features wasm-widgets --locked --test widgets

  # Local models end to end (M7): real downloads from the Hugging Face Hub,
  # llama.cpp's official release installed through mise, chat and
  # embeddings through the router, and agents' `local` provider finding
  # it. Tiny public models keep it to a few MiB.
  models:
    name: Local models (Hugging Face, llama.cpp, candle)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # mise asks GitHub's API for llama.cpp's latest release.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # What the asset patterns in termos-models/src/llama.rs must match:
      # the assets of the build TermOS pins (llama::VERSION).
      - name: The pinned llama.cpp build's assets
        run: |
          tag="$(sed -n 's/^pub const VERSION: &str = "\(.*\)";$/\1/p' crates/termos-models/src/llama.rs)"
          test -n "$tag"
          gh release view "$tag" --repo ggml-org/llama.cpp --json tagName,assets --jq '.tagName, .assets[].name'
      - name: Build
        run: cargo build --locked -p termos-cli
      - name: Models end to end
        run: ./.github/scripts/models-e2e.sh target/debug/termos
