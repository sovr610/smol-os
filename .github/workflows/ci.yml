name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    name: Lint (fmt, repo checks, cargo-deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Reads rust-toolchain.toml (pinned 1.97.0 + rustfmt/clippy), enables the
      # Swatinem cache and sets RUSTFLAGS=-D warnings.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: Work markers, ROADMAP sync, SPDX headers
        run: cargo xtask check-todos
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo-deny (licenses, advisories, bans, sources)
        run: cargo deny check

  test:
    name: Clippy + test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      # Clippy runs on every platform so cfg-gated (Linux-only / macOS-only)
      # code is linted where it compiles.
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: test
        run: cargo test --workspace --all-features --locked
      - name: smoke
        run: cargo run --locked -p termos-cli -- --version

  cross:
    name: Cross-build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}
      # cargo-zigbuild uses zig as the cross linker; `python3 -m ziglang` is
      # one of the locations it probes.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install zig
        run: python3 -m pip install ziglang==0.17.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      # The .2.31 suffix pins the glibc floor of the produced binary.
      - name: Build termos
        run: cargo zigbuild --release --locked -p termos-cli --target ${{ matrix.target }}.2.31
      - name: Inspect binary
        run: file target/${{ matrix.target }}/release/termos

  fuzz:
    name: Fuzz smoke (nightly, 60 s per target)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # cargo-fuzz needs nightly; the pinned stable toolchain is overridden
      # with `+nightly` only for this job.
      - name: Install nightly
        run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      # The prebuilt cargo-fuzz is a musl binary and would default to the
      # musl target, which the sanitizer cannot use; pin the gnu target.
      - name: Run fuzz targets
        working-directory: fuzz
        run: |
          for target in vt_advance config_parse keyspec_parse; do
            cargo +nightly fuzz run "$target" --target x86_64-unknown-linux-gnu -- -max_total_time=60
          done

  perf:
    name: Performance budgets (release)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Latency, idle CPU, memory, flood throughput
        run: cargo xtask perf 30
