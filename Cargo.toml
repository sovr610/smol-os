[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# `cargo build`/`cargo test` at the root operate on the product crates; xtask is
# reached through the `cargo xtask` alias (see .cargo/config.toml).
default-members = ["crates/*"]
# cargo-fuzz targets need a nightly toolchain; they live outside the workspace.
# third_party/ holds patched copies of dependencies (see [patch.crates-io]).
exclude = ["fuzz", "third_party"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
repository = "https://github.com/sovr610/smol-os"
homepage = "https://github.com/sovr610/smol-os"
authors = ["TermOS contributors"]
publish = false

[workspace.dependencies]
# Internal crates. Declare a dependency on another termos crate only when it is
# actually used; see ARCHITECTURE.md for the intended dependency direction.
termos-core = { path = "crates/termos-core" }
termos-render = { path = "crates/termos-render" }
termos-wm = { path = "crates/termos-wm" }
termos-term = { path = "crates/termos-term" }
termos-shell = { path = "crates/termos-shell" }
termos-apps = { path = "crates/termos-apps" }
termos-center = { path = "crates/termos-center" }
termos-harness = { path = "crates/termos-harness", default-features = false }
# Its `tls` feature is chosen by termos-cli (D-058).
termos-ai = { path = "crates/termos-ai", default-features = false }
# Its `tls` and `candle` features are chosen by termos-cli.
termos-models = { path = "crates/termos-models", default-features = false }
termos-devkit = { path = "crates/termos-devkit" }
termos-image = { path = "crates/termos-image" }
termos-hw = { path = "crates/termos-hw" }
termos-plugin = { path = "crates/termos-plugin" }

# Third-party crates. Pin versions here so every member uses the same one.
alacritty_terminal = "=0.26.0"
anyhow = "1.0.104"
base64 = "0.23.1"
flate2 = "1.1.10"
# The dev rootfs: unpacking the image's layer (D-110).
tar = { version = "0.4.46", default-features = false }
# Gemini CLI's release bundle (D-112).
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2"] }
bitflags = "2.13.2"
clap = { version = "4.6.7", features = ["derive"] }
compact_str = "0.10.0"
crossterm = "0.29.0"
jiff = "0.2.38"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
notify = "8.2.1"
notify-debouncer-mini = "0.7.0"
nucleo-matcher = "0.3.1"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
portable-pty = "0.9.0"
# Markdown for the viewer (no HTML output, no CLI).
# Deleting in the file manager moves to the system trash (D-050).
# Settings edit config.toml in place, keeping comments.
toml_edit = "0.25.17"
trash = { version = "5.2.9", default-features = false, features = ["coinit_apartmentthreaded"] }
# WASM status-line widgets (D-042, D-051): the component model with
# cranelift; no parallel compilation (rayon), no GC, no profiling.
wasmtime = { version = "50.0.1", default-features = false, features = ["async", "component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "50.0.1", default-features = false, features = ["p2"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
ratatui-core = { version = "0.1.2", features = ["std"] }
# CPU, memory, temperatures, disks, network, processes and GPUs; no rayon.
sysinfo = { version = "0.40.1", default-features = false, features = ["system", "component", "disk", "network", "gpu"] }
# NVIDIA temperature and power, through NVML loaded at run time.
nvml-wrapper = "0.13.0"
rustix = { version = "1.1.6", features = ["event", "process"] }
libc = "0.2.191"
getrandom = "0.4.3"
# Image decoding (png, jpeg, gif, webp, bmp) without rayon threads.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
windows-sys = "0.61.2"
ratatui-widgets = { version = "0.3.2", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Checking downloads (the pinned mise, D-053).
sha2 = "0.10.9"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time", "signal", "net", "io-util", "process"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
swash = "0.2.10"
bytemuck = "1.25.2"
drm = "0.15.0"
input = { version = "0.10.0", default-features = false, features = ["udev", "libinput_1_21"] }
# Without its default `custom_logger`, whose build script compiles C with
# `-I /usr/local/include`, which a cross compiler must not see (and the
# console does not use the logger).
libseat = { version = "0.2.4", default-features = false }
xkbcommon = { version = "0.9.0", default-features = false }

# Agents (M6, D-058 to D-064). HTTP clients are our own thin ones over
# reqwest (O-4 -> D-058); TLS is rustls with ring, installed by termos-ai's
# `tls` feature (aws-lc carries OpenSSL-licensed code, and ring cannot be
# cross-checked for Windows from Linux).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "charset", "json", "stream", "system-proxy"] }
rustls = { version = "0.23.35", default-features = false, features = ["std", "tls12", "logging"] }
secrecy = "0.10.3"
# iwd's D-Bus interface for the Network app (D-081); already in the build
# through keyring's Secret Service support.
zbus = "5.19.0"
# API keys in the OS keyring (Secret Service over zbus, Keychain, Credential
# Manager), or an age file unlocked by a passphrase (O-5 -> D-058).
keyring = "4.2.0"
age = { version = "0.11.5", default-features = false }
# Diff previews for file edits.
similar = "3.2.1"
# `search_code`: ripgrep's own crates.
grep = "0.4.1"
ignore = "0.4.34"
shlex = "2.0.1"
# Redacting key-shaped text from audit records.
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode-perl"] }
landlock = "0.4.7"
# MCP client over stdio and streamable HTTP.
rmcp = { version = "3.8.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }

# Local models (M7, D-065 to D-068): the router's HTTP server, candle for
# embedding models (pure Rust), tokenizers without its C parts.
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
sha1 = "0.10.6"
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }

# Dev-only crates.
criterion = "0.8.2"
insta = "1.49.0"
proptest = "1.12.0"
tempfile = "3.27.0"
vt100 = "0.18.1"

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# "No silent stubs" (DECISIONS.md D-018): unfinished work is a milestone-tagged
# work-marker comment mirrored in ROADMAP.md, never a panicking placeholder.
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Every unsafe block must carry a `// SAFETY:` justification.
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Patched copies of dependencies, each with a README saying what changed
# and when it can go.
[patch.crates-io]
# FP16 assembly that does not build for aarch64 Linux without the feature
# on its helpers (D-070).
gemm-common = { path = "third_party/gemm-common" }
