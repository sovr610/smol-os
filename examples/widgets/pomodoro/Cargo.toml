[package]
name = "termos-widget-pomodoro"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "A sample TermOS status-line widget: a pomodoro timer (build: cargo build --release --target wasm32-wasip2)"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "=0.63.0"

# Built for wasm32-wasip2 on its own, not part of the TermOS workspace.
[workspace]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
