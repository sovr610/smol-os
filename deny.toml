# cargo-deny configuration. Run with `cargo deny check`.
# TermOS is GPL-3.0-or-later (DECISIONS.md D-003): every dependency must be
# under a license that can be combined with GPLv3.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Each entry names why it cannot apply to TermOS or why no fix exists yet.
ignore = [
  # zbus 5, which `keyring` uses for the Secret Service (D-058), still
  # depends on these; upstream folded them into zbus itself
  # (z-galaxy/zbus#2043) and there is no release without them yet. They
  # are maintained as part of zbus; nothing is known to be wrong with them.
  { id = "RUSTSEC-2026-0370", reason = "zvariant: folded into zbus, no release without it yet" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: folded into zbus, no release without it yet" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: folded into zbus, no release without it yet" },
  # Used only at build time, by age's localisation macros reading their
  # i18n.toml; never on input TermOS receives.
  { id = "RUSTSEC-2026-0374", reason = "basic-toml: build-time only (age's i18n macros)" },
  { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2: build-time only (age's i18n macros)" },
  # A macro crate, expanded at build time by gemm (candle's matrix code).
  { id = "RUSTSEC-2024-0436", reason = "paste: build-time macro only (gemm, via candle)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive and weak-copyleft licenses that are GPLv3-compatible, plus the
# GPL family itself. Deliberately absent: GPL-2.0-only (incompatible with
# GPLv3), AGPL (network clause we do not want to impose), OpenSSL/SSLeay
# (incompatible; we use rustls), and anything proprietary.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "GPL-2.0-or-later",
  "GPL-3.0-only",
  "GPL-3.0-or-later",
  "ISC",
  "LGPL-2.1-or-later",
  "LGPL-3.0-only",
  "LGPL-3.0-or-later",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]
unused-allowed-license = "allow"

[licenses.private]
# Our own unpublished workspace crates.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  { name = "openssl", reason = "OpenSSL license is not GPLv3-compatible; use rustls" },
  { name = "openssl-sys", reason = "OpenSSL license is not GPLv3-compatible; use rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
